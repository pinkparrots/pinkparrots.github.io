<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Parrots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Wanted Sans';
            src: url('https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/WantedSansVariable.woff2') format('woff2-variations');
            font-weight: 100 900;
            font-style: normal;
        }

        body {
            font-family: 'Wanted Sans', sans-serif;
            background: url('src/back.png') no-repeat center center;
            background-color: #0f0f16;
            background-size: cover;
            background-attachment: fixed;
            color: #e0e0e0;
            margin: 0;
            overflow-x: hidden;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-up {
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        .card-container::-webkit-scrollbar {
            height: 8px;
        }

        .card-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .card-container::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 10px;
        }

        .card-container:hover::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .card-container:hover::-webkit-scrollbar-thumb {
            background: #ec4899;
        }

        .card-container::-webkit-scrollbar-thumb:hover {
            background: #f472b6;
        }
        
        .card-container {
            scrollbar-width: thin;
            scrollbar-color: transparent transparent;
            transition: scrollbar-color 0.3s ease-out;
        }

        .card-container:hover {
            scrollbar-color: #ec4899 rgba(255, 255, 255, 0.05);
        }

        .card {
            background: rgba(20, 20, 32, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 85, 233, 0.3);
        }

        .btn {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        
        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 85, 233, 0.5);
            box-shadow: 0 0 15px rgba(255, 85, 233, 0.15);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff55e9, #fd90ff);
            color: #1a1a24;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 85, 233, 0.3);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 25px rgba(255, 85, 233, 0.5);
            filter: brightness(1.05);
        }

        .text-gradient {
            background: linear-gradient(90deg, #ff55e9, #fd90ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8 relative">
    
    <canvas id="particles"></canvas>

    <main class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center z-10">
        <div class="text-center lg:text-left">
            <img src="src/favicon.png" 
                 alt="Pink Parrots Logo" 
                 class="w-24 h-24 mb-4 mx-auto lg:mx-0 animate-fade-up"
                 onerror="this.onerror=null;this.src='https://placehold.co/100x100/ec4899/ffffff?text=Logo';"
            >
            
            <h1 class="text-5xl md:text-6xl font-extrabold mb-4 text-gradient animate-fade-up delay-100">Pink Parrots</h1>
            <p class="text-lg text-gray-300 mb-6 animate-fade-up delay-200">
                모두가 즐길수 있는<br>마인크래프트 서버를 위해
            </p>
            <a href="#" class="inline-block text-gray-400 hover:text-[#ff55e9] transition-colors duration-300 animate-fade-up delay-300">
                <i class="fab fa-discord fa-2x"></i>
            </a>
        </div>
        <div class="w-full animate-fade-up delay-400">
            <div class="card-container flex overflow-x-auto space-x-6 pb-4">
            
                <div class="card flex-shrink-0 w-72 rounded-2xl p-6 text-center">
                    <h2 class="text-2xl font-bold mb-2 text-white">ConstaX</h2>
                    <p class="text-gray-400 mb-8 h-12 text-sm leading-relaxed">하드코어한 경쟁을 즐기는 당신에게.</p>
                    <div class="space-y-3">
                        <button class="btn btn-primary w-full py-2.5 rounded-xl font-medium tracking-wide">전적 확인하기</button>
                        <button class="btn btn-secondary join-btn w-full py-2.5 rounded-xl font-bold tracking-wide" data-url="constax.pkps.kro.kr">서버 접속하기</button>
                    </div>
                </div>

                <div class="card flex-shrink-0 w-72 rounded-2xl p-6 text-center">
                    <h2 class="text-2xl font-bold mb-2 text-white">Ast.</h2>
                    <p class="text-gray-400 mb-8 h-12 text-sm leading-relaxed">스토리 몰입형 최신 버전 RPG 서버.</p>
                    <div class="space-y-3">
                        <button class="btn btn-primary w-full py-2.5 rounded-xl font-medium tracking-wide">정보 확인하기</button>
                        <button class="btn btn-secondary join-btn w-full py-2.5 rounded-xl font-bold tracking-wide" data-url="AST IS NOT AVAILABLE">서버 접속하기</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let width, height, particles;

        function initParticles() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            const particleCount = Math.floor((width * height) / 15000);
            
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2 + 0.5,
                    dx: (Math.random() - 0.5) * 0.4,
                    dy: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 85, 233, ${p.opacity})`;
                ctx.fill();
                
                p.x += p.dx;
                p.y += p.dy;
                
                if (p.x < 0 || p.x > width) p.dx *= -1;
                if (p.y < 0 || p.y > height) p.dy *= -1;
            });
            
            requestAnimationFrame(drawParticles);
        }

        window.addEventListener('resize', initParticles);
        initParticles();
        drawParticles();

        const joinButtons = document.querySelectorAll('.join-btn');

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
            } catch (err) {}
            document.body.removeChild(textarea);
        }

        joinButtons.forEach(button => {
            button.addEventListener('click', (event) => {
                event.preventDefault();
                const urlToCopy = button.dataset.url;
                if (urlToCopy) {
                    copyToClipboard(urlToCopy);
                    
                    const originalText = button.textContent;
                    button.textContent = '복사됨!';
                    button.disabled = true;

                    setTimeout(() => {
                        button.textContent = originalText;
                        button.disabled = false;
                    }, 2000);
                }
            });
        });
    </script>

</body>
</html>
