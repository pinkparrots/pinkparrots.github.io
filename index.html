<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Parrots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Wanted Sans';
            src: url('https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/WantedSansVariable.woff2') format('woff2-variations');
            font-weight: 100 900;
            font-style: normal;
        }

        body {
            font-family: 'Wanted Sans', sans-serif;
            background: url('src/back.png') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            color: #e0e0e0;
        }

        .card-container::-webkit-scrollbar {
            height: 8px;
        }

        .card-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .card-container::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 10px;
        }

        .card-container:hover::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .card-container:hover::-webkit-scrollbar-thumb {
            background: #ec4899;
        }

        .card-container::-webkit-scrollbar-thumb:hover {
            background: #f472b6;
        }
        
        .card-container {
            scrollbar-width: thin;
            scrollbar-color: transparent transparent;
            transition: scrollbar-color 0.3s ease-out;
        }

        .card-container:hover {
            scrollbar-color: #ec4899 rgba(255, 255, 255, 0.1);
        }
        /* --- End of scrollbar styles --- */


        .card {
            background: rgba(30, 30, 46, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.3s ease;
        }

        .btn {
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background-color: #4a5568;
        }
        .btn-primary:hover {
            background-color: #2d3748;
        }

        .btn-secondary {
            background-color: #38a169;
        }
        .btn-secondary:hover {
            background-color: #2f855a;
        }

        .text-gradient {
            background: linear-gradient(90deg, #ff55e9, #fd90ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">
    <main class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center">
        <div class="text-center lg:text-left">
            <img src="src/favicon.png" 
                 alt="Pink Parrots Logo" 
                 class="w-24 h-24 mb-4 mx-auto lg:mx-0"
                 onerror="this.onerror=null;this.src='https://placehold.co/100x100/ec4899/ffffff?text=Logo';"
            >
            
            <h1 class="text-5xl md:text-6xl font-extrabold mb-4 text-gradient">Pink Parrots</h1>
            <p class="text-lg text-gray-300 mb-6">
                모두가 즐길수 있는<br>마인크래프트 서버를 위해
            </p>
            <a href="#" class="text-gray-400 hover:text-white transition-colors duration-300">
                <i class="fab fa-discord fa-2x"></i>
            </a>
        </div>
        <div class="w-full">
            <div class="card-container flex overflow-x-auto space-x-6 pb-4">
            
                <div class="card flex-shrink-0 w-72 rounded-xl p-6 text-center">
                    <h2 class="text-2xl font-bold mb-2">ConstaX</h2>
                    <p class="text-gray-400 mb-8 h-12">하드코어한 경쟁을 즐기는 당신에게.</p>
                    <div class="space-y-3">
                        <button class="btn btn-primary w-full py-2 rounded-lg font-semibold">전적 확인하기</button>
                        <button class="btn btn-secondary join-btn w-full py-2 rounded-lg font-semibold" data-url="constax.pkps.kro.kr">서버 접속하기</button>
                    </div>
                </div>

                    <div class="card flex-shrink-0 w-72 rounded-xl p-6 text-center">
                        <h2 class="text-2xl font-bold mb-2">Ast.</h2>
                        <p class="text-gray-400 mb-8 h-12">스토리 몰입형 최신 버전 RPG 서버.</p>
                        <div class="space-y-3">
                            <button class="btn btn-primary w-full py-2 rounded-lg font-semibold">정보 확인하기</button>
                            <button class="btn btn-secondary join-btn w-full py-2 rounded-lg font-semibold" data-url="AST IS NOT AVAILABLE">서버 접속하기</button>
                        </div>
                    </div>
            </div>
        </div>
    </main>

    <script>
        const joinButtons = document.querySelectorAll('.join-btn');

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('failed to copy!!', err);
            }
            document.body.removeChild(textarea);
        }

        joinButtons.forEach(button => {
            button.addEventListener('click', (event) => {
                event.preventDefault();
                const urlToCopy = button.dataset.url;
                if (urlToCopy) {
                    copyToClipboard(urlToCopy);
                    
                    const originalText = button.textContent;
                    button.textContent = '복사됨!';
                    button.disabled = true;

                    setTimeout(() => {
                        button.textContent = originalText;
                        button.disabled = false;
                    }, 2000);
                }
            });
        });
    </script>

</body>
</html>
